<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <title>Eiscafé Fantasia – Bewertung</title>

  <script
    data-goatcounter="https://reviewspot.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"></script>

  <style>
    :root {
      --bg:#0b0b0c;
      --text:#ffffff;
      --muted:#a9a9ad;
      --gold:#f4c542;
      --line:#2a2a2f;
    }

    * { box-sizing:border-box; }

    html, body {
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    body {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .wrap {
      width:min(100%,430px);
      text-align:center;
    }

    .eyebrow {
      font-size:13px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:14px;
    }

    h1 {
      margin:0;
      font-size:34px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .stars {
      margin:18px 0 12px;
      font-size:25px;
      letter-spacing:5px;
      color:var(--gold);
      white-space:nowrap;
    }

    .message {
      margin:0 auto;
      max-width:320px;
      color:var(--muted);
      font-size:16px;
      line-height:1.5;
    }

    .loader {
      width:180px;
      height:4px;
      background:var(--line);
      border-radius:999px;
      overflow:hidden;
      margin:24px auto 0;
    }

    .loader span {
      display:block;
      width:40%;
      height:100%;
      border-radius:999px;
      background:var(--text);
      animation:load .65s ease-out forwards;
      transform-origin:left;
    }

    .fallback {
      margin-top:22px;
      font-size:13px;
      color:#77777c;
    }

    .fallback a {
      color:#b8b8bc;
      text-decoration:none;
      border-bottom:1px solid #44444a;
    }

    @keyframes load {
      from { transform:scaleX(.05); opacity:.5; }
      to { transform:scaleX(2.5); opacity:1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader span {
        animation:none;
        width:100%;
      }
    }
  </style>

  <script>
    // ----------------------------------------------------------
    // REVIEWSPOT ZIELMODUS
    // "direct" = direkt ins Google-Bewertungsfenster (STANDARD)
    // "maps"   = Google-Maps-Unternehmensseite (BACKUP)
    // ----------------------------------------------------------
    const targetMode = 'direct';

    const directReviewUrl = 'https://search.google.com/local/writereview?placeid=ChIJ84oSNBgHl0cRRiOZAWLYWsg';
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=Eiscaf%C3%A9%20Fantasia&query_place_id=ChIJ84oSNBgHl0cRRiOZAWLYWsg';

    const targetUrl = targetMode === "maps" ? mapsUrl : directReviewUrl;

    window.addEventListener("load", function () {
      setTimeout(function () {
        window.location.replace(targetUrl);
      }, 4500);
    });

    setTimeout(function () {
      window.location.replace(targetUrl);
    }, 18000);
  </script>
</head>

<body>
  <main class="wrap" aria-live="polite">
    <div class="eyebrow">Google Bewertung</div>
    <h1>Eiscafé Fantasia</h1>

    <div class="stars" aria-label="5 Sterne">★★★★★</div>

    <p class="message">Bewertungsfenster wird geöffnet …</p>

    <div class="loader" aria-hidden="true">
      <span></span>
    </div>

    <p class="fallback">
      Falls nichts passiert,
      <a href="https://search.google.com/local/writereview?placeid=ChIJ84oSNBgHl0cRRiOZAWLYWsg">hier öffnen</a>.
    </p>
  </main>
</body>
</html>
